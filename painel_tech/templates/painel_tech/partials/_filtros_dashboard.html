<form class="filters tech-filters" method="get" action="{{ request.path }}">
  <div class="search-box tech-search-box">
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    <label class="sr-only" for="dashboard-busca">Buscar projeto</label>
    <input id="dashboard-busca" type="search" name="q" placeholder="Buscar por nome do projeto..." value="{{ args.get('q', '') }}" autocomplete="off">
  </div>

  <div class="filter-group tech-filter-group">
    <div class="tech-filter-field">
      <label for="dashboard-responsavel">Responsável</label>
      <span class="filter-item">
        <select id="dashboard-responsavel" name="responsavel" aria-label="Responsável" data-tech-rich-select>
          <option value="" data-icon="fa-solid fa-users">Todos</option>
          {% for membro in membros %}
          <option value="{{ membro.id }}" data-avatar-email="{{ membro.email or '' }}" {{ 'selected' if args.get('responsavel') == membro.id|string else '' }}>{{ membro.nome }}</option>
          {% endfor %}
        </select>
      </span>
    </div>
    <div class="tech-filter-field">
      <label for="dashboard-status">Status</label>
      <span class="filter-item">
        <select id="dashboard-status" name="status" aria-label="Status" data-tech-rich-select>
          <option value="" data-icon="fa-solid fa-layer-group">Todos</option>
          {% for chave, meta in STATUS.items() %}
          <option value="{{ chave }}" data-color="{{ meta.cor }}" {{ 'selected' if args.get('status') == chave else '' }}>{{ meta.label }}</option>
          {% endfor %}
        </select>
      </span>
    </div>
    {% for campo in ['impacto', 'urgencia', 'risco', 'esforco'] %}
    <div class="tech-filter-field">
      <label for="dashboard-{{ campo }}">{{ INDICADORES[campo].label }}</label>
      <span class="filter-item">
        <select id="dashboard-{{ campo }}" name="{{ campo }}" aria-label="{{ INDICADORES[campo].label }}" data-tech-rich-select>
          <option value="" data-icon="fa-solid {{ 'fa-bullseye' if campo == 'impacto' else 'fa-bolt' if campo == 'urgencia' else 'fa-triangle-exclamation' if campo == 'risco' else 'fa-gauge-high' }}">Todos</option>
          {% for chave, meta in INDICADORES[campo].opcoes.items() %}
          <option value="{{ chave }}" data-color="{{ meta.cor }}" {{ 'selected' if args.get(campo) == chave else '' }}>{{ meta.label }}</option>
          {% endfor %}
        </select>
      </span>
    </div>
    {% endfor %}
    <div class="tech-filter-field">
      <label for="dashboard-ritmo">Ritmo</label>
      <span class="filter-item">
        <select id="dashboard-ritmo" name="ritmo" aria-label="Ritmo" data-tech-rich-select>
          <option value="" data-icon="fa-solid fa-wave-square">Todos</option>
          {% for chave, meta in RITMO.items() %}
          <option value="{{ chave }}" data-color="{{ meta.cor }}" {{ 'selected' if args.get('ritmo') == chave else '' }}>{{ meta.label }}</option>
          {% endfor %}
        </select>
      </span>
    </div>
    <label class="tech-filter-field tech-date-field">
      <span>De</span>
      <span class="filter-item"><i class="fa-regular fa-calendar" aria-hidden="true"></i><input type="date" name="de" value="{{ args.get('de', '') }}" aria-label="Data inicial"></span>
    </label>
    <label class="tech-filter-field tech-date-field">
      <span>Até</span>
      <span class="filter-item"><i class="fa-regular fa-calendar-check" aria-hidden="true"></i><input type="date" name="ate" value="{{ args.get('ate', '') }}" aria-label="Data final"></span>
    </label>
  </div>

  <div class="tech-filter-footer">
    <label class="tech-attention-filter">
      <input type="checkbox" name="atencao" value="1" {{ 'checked' if args.get('atencao') == '1' else '' }}>
      Somente os que precisam de atenção
    </label>
    <div class="tech-filter-actions">
      <a class="btn-secondary" href="{{ url_limpar }}">Limpar</a>
      <button class="btn-primary" type="submit"><i class="fa-solid fa-filter" aria-hidden="true"></i> Filtrar</button>
    </div>
  </div>
</form>
