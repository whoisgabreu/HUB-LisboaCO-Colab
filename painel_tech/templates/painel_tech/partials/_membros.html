<form class="inline" method="post" action="{{ url_for('painel_tech.membro_criar') }}"
      hx-post="{{ url_for('painel_tech.membro_criar') }}"
      hx-target="#aba-membros" hx-swap="innerHTML" hx-indicator="#aba-membros">
  <input type="text" name="nome" placeholder="Nome" required>
  <input type="email" name="email" placeholder="E-mail (opcional)">
  <button class="btn btn-secundario" type="submit" hx-disabled-elt="this">Adicionar</button>
</form>
<div class="tabela-wrapper">
  <table class="tabela">
    <thead>
      <tr>
        <th scope="col">Nome</th>
        <th scope="col">E-mail</th>
        <th scope="col">Capacidade</th>
        <th scope="col">Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for membro in membros %}
      <tr>
        <td data-label="Nome">{{ membro.nome }}</td>
        <td data-label="E-mail">{{ membro.email or '—' }}</td>
        <td data-label="Capacidade">
          <form class="inline membro-cap-form" method="post" action="{{ url_for('painel_tech.membro_capacidade', membro_id=membro.id) }}"
                hx-post="{{ url_for('painel_tech.membro_capacidade', membro_id=membro.id) }}"
                hx-target="#aba-membros" hx-swap="innerHTML" hx-indicator="#aba-membros">
            <input type="number" min="0" name="capacidade" value="{{ membro.capacidade or '' }}" placeholder="padrão" title="Limite de projetos ativos (vazio = padrão)">
            <button class="btn btn-fantasma" type="submit" hx-disabled-elt="this">Salvar</button>
          </form>
        </td>
        <td data-label="Ações">
          <form method="post" action="{{ url_for('painel_tech.membro_excluir', membro_id=membro.id) }}"
                hx-post="{{ url_for('painel_tech.membro_excluir', membro_id=membro.id) }}"
                hx-target="#aba-membros" hx-swap="innerHTML" hx-indicator="#aba-membros"
                hx-confirm="Remover membro?">
            <button class="btn-icone btn-icone-perigo" title="Remover" aria-label="Remover membro">✕</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="vazio">Nenhum membro cadastrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
