<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style/login.css') }}">
  <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
  {% include "components/icon_title.html" %}
</head>

<body>

  {% include "components/loader.html" %}

  <div class="login-layout">

    <!-- ── LADO ESQUERDO: FORMULÁRIO ── -->
    <div class="login-panel">

      <div class="login-header">
        <h2 class="login-title">Bem-vindo de volta</h2>
        <p class="login-subtitle">Faça seu login para continuar.</p>
      </div>

      <form method="POST" name="login-form" class="login-form">

        <div class="form-group">
          <label for="login-email">E-mail</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="login-email" name="email" placeholder="seu@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            <i class="fa-solid fa-eye input-icon-right toggle-eye" id="toggleSenha"></i>
          </div>
        </div>

        <label class="remember-checkbox">
          <input type="checkbox" name="remember" id="remember">
          Lembrar por 7 dias
        </label>

        {% if error %}
        <div class="error-message">
          <i class="fa-solid fa-circle-exclamation"></i>
          <p>{{ error }}</p>
        </div>
        {% endif %}

        <button type="submit" id="login-btn">
          <span>Entrar</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

      </form>

      <footer class="login-footer">
        <p>© 2025 - 2026 Corvus Tech Team · Time de Tecnologia da Lisboa&amp;CO</p>
      </footer>

    </div>

    <!-- ── LADO DIREITO: ESPAÇO PARA CONTEÚDO ── -->
    <div class="login-visual">
      <div class="visual-content">
        <img id="logo1" src="/static/images/v4-logo.png" draggable="false" oncontextmenu="return false"
          ondragstart="return false" alt="Logo V4">
        <div class="login-brand">
          <div class="brand-text">
            <h1 class="brand-name">Lisboa<span>&CO</span></h1>
            <p class="brand-sub">Hub Operacional</p>
          </div>
        </div>
        <!-- Reservado para conteúdo futuro -->
      </div>
    </div>

  </div>

</body>

</html>
