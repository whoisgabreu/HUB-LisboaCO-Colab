<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sem conexão | HUB Lisboa&CO</title>
    <meta name="theme-color" content="#000000">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem
                calc(1.5rem + env(safe-area-inset-bottom, 0px));
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .offline-card {
            width: 100%;
            max-width: 380px;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            background: #17171b;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .offline-card img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 1rem; }
        h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
        p { margin: 0 0 1.5rem; font-size: 0.92rem; line-height: 1.5; color: #a0a0a0; }
        .acoes { display: flex; flex-direction: column; gap: 0.6rem; }
        button, a {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        button { border: none; background: #d61616; color: #fff; font-family: inherit; }
        button:hover { background: #b01010; }
        a { border: 1px solid rgba(255, 255, 255, 0.16); color: #fff; }
        a:hover { border-color: #d61616; }
    </style>
</head>

<body>
    <main class="offline-card">
        <img src="/static/images/v4-logo.png" alt="HUB Lisboa&CO">
        <h1>Sem conexão</h1>
        <p>Não foi possível carregar o HUB agora. Verifique sua internet e tente novamente.</p>
        <div class="acoes">
            <button type="button" onclick="location.reload()">Tentar novamente</button>
            <a href="/feed">Ir para o feed</a>
        </div>
    </main>
</body>

</html>
