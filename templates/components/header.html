{% include "components/loader.html" %}

{% include "components/up-button.html" %}

<link rel="stylesheet" href="/static/style/notificacoes.css">
<link rel="stylesheet" href="/static/style/chat.css">
<link rel="stylesheet" href="/static/style/hub-modal.css">
<script src="/static/js/notificacoes.js" defer></script>
<script src="/static/js/chat.js" defer></script>
<script src="/static/js/hub-modal.js" defer></script>

<header class="header">
    <button id="floatingBurgerBtn" class="floating-burger" title="Abrir Menu">
        <i class="fas fa-bars"></i>
    </button>
    <div class="header-left">
        <button class="burger-menu" aria-label="Abrir menu">
            <i class="fas fa-bars"></i>
        </button>
        <img class="logo" src="/static/images/v4-logo.png" alt="V4">
        <div class="header-title">
            <h1>Hub Lisboa&CO</h1>
        </div>
    </div>

    <div class="header-right">
        <button id="notifBell" class="notif-bell" title="Notificações" onclick="Notificacoes.toggle(event)">
            <i class="fa-regular fa-bell"></i>
            <span id="notifBadge" class="notif-badge" style="display:none;">0</span>
        </button>
        <div id="notifDropdown" class="notif-dropdown">
            <div class="notif-head">
                <span>Notificações</span>
                <button type="button" onclick="Notificacoes.marcarTodas()">Marcar todas como lidas</button>
            </div>
            <div id="notifList" class="notif-list">
                <div class="notif-empty">Sem notificações.</div>
            </div>
        </div>
    </div>
</header>

{% include "components/chat_widget.html" %}
